<?xml version="1.0" encoding="utf-8"?>
<svg class="wedding-compass-logo" viewBox="0 0 320 320" width="320" height="320" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Custom text styling using fallback color strings -->
        <style>
            .compass-cardinal {
                font-family: 'Georgia', 'Times New Roman', serif;
                font-size: 20px;
                font-style: italic;
                font-weight: bold;
                fill: var(--text-grey, #3E4144);
                text-anchor: middle;
                dominant-baseline: middle;
            }
            .compass-initial {
                font-family: 'Times New Roman', Times, serif;
                font-size: 16px;
                font-weight: bold;
                fill: var(--text-grey, #3E4144);
                text-anchor: middle;
                dominant-baseline: middle;
            }
            .compass-filled-side {
                fill: var(--sage-green, #7A8B7B);
                stroke: var(--sage-green, #7A8B7B);
                stroke-width: 1;
            }
            .compass-hollow-side {
                fill: none;
                stroke: var(--sage-green, #7A8B7B);
                stroke-width: 1;
            }
            .compass-line {
                stroke: var(--sage-green, #7A8B7B);
                stroke-width: 1;
                fill: none;
            }
            .compass-divider {
                stroke: var(--sage-green, #7A8B7B);
                stroke-width: 0.75;
            }
            .compass-heart {
                fill: var(--sage-green, #7A8B7B);
            }
        </style>

	<mask id="center-punch-hole">
	    <rect x="0" y="0" width="320" height="320" fill="#FFFFFF" />
	    <circle cx="160" cy="160" r="42" fill="#000000" />
	</mask>
    </defs>

    <!-- 1. Outer Cardinal Labels (Fully padded within 320x320 canvas) -->
    <text x="160" y="22" class="compass-cardinal">N</text>
    <text x="298" y="160" class="compass-cardinal">E</text>
    <text x="160" y="298" class="compass-cardinal">S</text>
    <text x="22" y="160" class="compass-cardinal">W</text>

    <!-- 2. Concentric Track Rings & Outer Tick Marks -->
    <circle cx="160" cy="160" r="88" class="compass-line" />
    <circle cx="160" cy="160" r="83" class="compass-line" stroke-dasharray="2 3" />
    <circle cx="160" cy="160" r="62" class="compass-line" />
    
    <!-- Outer accent cross-hairs -->
    <line x1="160" y1="35" x2="160" y2="50" class="compass-line" />
    <line x1="270" y1="160" x2="285" y2="160" class="compass-line" />
    <line x1="160" y1="270" x2="160" y2="285" class="compass-line" />
    <line x1="35" y1="160" x2="50" y2="160" class="compass-line" />

    <g mask="url(#center-punch-hole)">
        <!-- 3. Intercardinal Medium Points (NE, SE, SW, NW) - Full Symmetrical Triangles -->
        <g transform="translate(160,160) rotate(45)">
            <polygon points="0,0 -10,0 0,-92" class="compass-hollow-side" />
            <polygon points="0,0 10,0 0,-92" class="compass-filled-side" />
   	 </g>
    	<g transform="translate(160,160) rotate(135)">
            <polygon points="0,0 -10,0 0,-92" class="compass-hollow-side" />
            <polygon points="0,0 10,0 0,-92" class="compass-filled-side" />
    	</g>
    	<g transform="translate(160,160) rotate(225)">
            <polygon points="0,0 -10,0 0,-92" class="compass-hollow-side" />
            <polygon points="0,0 10,0 0,-92" class="compass-filled-side" />
   	</g>
    	<g transform="translate(160,160) rotate(315)">
            <polygon points="0,0 -10,0 0,-92" class="compass-hollow-side" />
            <polygon points="0,0 10,0 0,-92" class="compass-filled-side" />
    	</g>

    	<!-- 4. Principal Major Points (North, East, South, West) - Full Symmetrical Triangles -->
    	<!-- North -->
    	<g transform="translate(160,160) rotate(0)">
            <polygon points="0,0 -14,0 0,-110" class="compass-hollow-side" />
            <polygon points="0,0 14,0 0,-110" class="compass-filled-side" />
    	</g>
    	<!-- East -->
    	<g transform="translate(160,160) rotate(90)">
            <polygon points="0,0 -14,0 0,-110" class="compass-hollow-side" />
            <polygon points="0,0 14,0 0,-110" class="compass-filled-side" />
   	</g>
    	<!-- South -->
    	<g transform="translate(160,160) rotate(180)">
            <polygon points="0,0 -14,0 0,-110" class="compass-hollow-side" />
            <polygon points="0,0 14,0 0,-110" class="compass-filled-side" />
    	</g>
    	<!-- West -->
    	<g transform="translate(160,160) rotate(270)">
            <polygon points="0,0 -14,0 0,-110" class="compass-hollow-side" />
            <polygon points="0,0 14,0 0,-110" class="compass-filled-side" />
    	</g>
    </g>

    <!-- 5. Center Crest Backdrop Ring (Layers perfectly over the triangle bases) -->
    <circle cx="160" cy="160" r="42" fill="none" stroke="var(--sage-green, #7A8B7B)" stroke-width="1.2" />

    <!-- 6. Cross Divider Lines inside Center Crest -->
    <line x1="130" y1="130" x2="190" y2="190" class="compass-divider" />
    <line x1="130" y1="190" x2="190" y2="130" class="compass-divider" />

    <!-- 7. Quadrant Display Items -->
    <!-- Top Quadrant: Airplane Silhouette -->
    <g transform="translate(160, 134) scale(0.85) translate(-12, -12)">
        <path fill="var(--sage-green, #7A8B7B)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
    </g>

    <!-- Left Quadrant: Initials 'D' -->
    <text x="136" y="161" class="compass-initial">D</text>

    <!-- Right Quadrant: Initials 'K' -->
    <text x="184" y="161" class="compass-initial">K</text>

    <!-- Bottom Quadrant: Terracotta Heart -->
    <g transform="translate(160, 177)">
        <path class="compass-heart" d="M12,21.35 L10.55,20.03 C5.4,15.36 2,12.28 2,8.5 C2,5.42 4.42,3 7.5,3 C9.24,3 10.91,3.81 12,5.09 C13.09,3.81 14.76,3 16.5,3 C19.58,3 22,5.42 22,8.5 C22,12.28 18.6,15.36 13.45,20.04 L12,21.35 Z" transform="scale(0.6) translate(-12, 0)"/>
    </g>

    <!-- 8. Center Point Pivot Rivet -->
    <circle cx="160" cy="160" r="3.5" fill="var(--sage-green, #7A8B7B" stroke="var(--sage-green, #7A8B7B)" stroke-width="1" />
</svg>
