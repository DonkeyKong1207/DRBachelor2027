    role="dialog"
    aria-modal="true"
    aria-labelledby="birthdayTakeoverModalTitle"
  >

    <h2
      id="birthdayTakeoverModalTitle"

          birthday-button-secondary
          birthday-hidden
        "

      >

      </button>


      <button
        id="birthdayTakeoverOk"
        class="
          birthday-button
          birthday-button-primary
          birthday-hidden
        "
        type="button"
      >
        OK
      </button>

    </div>

  </div>

       ======================================================= -->

  <button

      birthday-button
      birthday-button-primary
      birthday-hidden
    "
    type="button"
  >
    CLOSE
  </button>


  <!-- =======================================================
       TERMINAL
       ======================================================= -->

  <div
    id="birthdayTakeoverTerminal"

      birthday-terminal
      birthday-hidden
    "

  >

    <div class="birthday-terminal-bar">

      <div
        class="birthday-terminal-dots"
        aria-hidden="true"
      >
        <span></span>
        <span></span>
        <span></span>
      </div>

      <span>
        SYSTEM OVERRIDE
      </span>

    </div>


    <div class="birthday-terminal-body">

      <span
        id="birthdayTakeoverTerminalText"
      ></span>

      <span
        id="birthdayTakeoverTerminalCursor"
        class="birthday-terminal-cursor"
        aria-hidden="true"
      ></span>


      <div
        id="birthdayTakeoverProgressWrap"
        class="
          birthday-progress-wrap
          birthday-hidden
        "
      >

        <div
          class="birthday-progress-track"
          aria-hidden="true"
        >

          <div
            id="birthdayTakeoverProgress"
            class="birthday-progress-bar"
          ></div>

        </div>


        <div class="birthday-progress-meta">

          <span>
            extracting
          </span>

          <span
            id="birthdayTakeoverProgressPercent"
          >
            0%
          </span>

        </div>

      </div>

    </div>

  </div>

       GLITCH LAYERS
       ======================================================= -->

  <div
    id="birthdayTakeoverNoise"
    class="birthday-glitch-noise"
    aria-hidden="true"

  <div
    id="birthdayTakeoverTear"
    class="birthday-glitch-tear"
    aria-hidden="true"
  ></div>


  <div
    id="birthdayTakeoverCorruption"
    class="birthday-corruption"
    aria-hidden="true"
  ></div>


  <!-- =======================================================

  <div

    class="
      birthday-crt
      birthday-hidden
    "

  <div

      birthday-launch
      birthday-hidden
    "

      birthday-slam
      birthday-hidden
    "

  >

      class="birthday-slam-flash"
      aria-hidden="true"
    ></div>

    <span
      id="birthdayTakeoverSlamText"
    ></span>

  </div>


  <!-- =======================================================
       SENTIMENTAL STORY
       ======================================================= -->

  <div
    id="birthdayTakeoverStory"
    class="
      birthday-story
      birthday-hidden
    "
  >

    <!--
      JS inserts:
        lifeImage*
        birthdayImage*
        travelImage*
        coupleImage*
    -->

    <div
      id="birthdayTakeoverPhotoLayer"
      class="birthday-photo-layer"
      aria-hidden="true"
    ></div>


    <!--
      engagementImage1 = proposal focal image
      engagementImage2-5 = surrounding images
    -->

    <div
      id="birthdayTakeoverEngagementLayer"
      class="birthday-engagement-layer"
      aria-hidden="true"
    ></div>


    <div
      id="birthdayTakeoverStoryText"
      class="birthday-story-text"
    >

      <span
        id="birthdayTakeoverStoryTextValue"
      ></span>

      <span
        id="birthdayTakeoverStoryCursor"
        class="
          birthday-story-text-cursor
          birthday-hidden
        "
        aria-hidden="true"
      ></span>

    </div>

  </div>

       ======================================================= -->

  <div
    id="birthdayTakeoverFinal"
    class="
      birthday-final
      birthday-hidden
    "
  >

    <div
      id="birthdayTakeoverFinalMessage"
      class="birthday-final-message"
    >
      Happy 33rd Birthday,
      Here's to many more together
    </div>


    <div
      id="birthdayTakeoverCountdown"
      class="birthday-countdown"
      aria-live="polite"
    ></div>

  </div>


  <!-- =======================================================
       MUSIC
       ======================================================= -->

  <!--
    Starts as sentimental montage begins.

    Continues through:
      Life with you...
      Four trips...
      Six countries...
      My favorite place...
      Engagement scene

    JS fades it out as the engagement composition
    transitions into the final birthday message.
  -->

  <audio
    id="birthdayTakeoverLoveAudio"
    preload="auto"
    src="Assets/takeover/cantHelpFallingInLove.mp3"
  ></audio>


  <!--
    Starts AFTER the:
      3
      2
      1
    countdown.

    Your current backing track is approximately 15 seconds.
    The takeover will remain on-screen until this track ends.
  -->

  <audio
    id="birthdayTakeoverBirthdayAudio"
    preload="auto"
    src="Assets/takeover/happyBirthday.mp3"
  ></audio>


  <!-- =======================================================
       OPTIONAL SOUND EFFECTS

       You can leave these src values empty until you find
       sound effects. The JS will simply skip them.
       ======================================================= -->


  <!-- page corruption / digital interference -->

  <audio
    id="birthdayTakeoverGlitchAudio"
    preload="auto"
  ></audio>


  <!-- CRT / TV shutoff -->

  <audio
    id="birthdayTakeoverCrtAudio"
    preload="auto"
  ></audio>


  <!--
    Same impact file will be reused for:
      HAPPY
      BIRTHDAY
      DAVIS

    JS can change playbackRate + volume for each hit.
  -->

  <audio
    id="birthdayTakeoverSlamAudio"
    preload="auto"
  ></audio>

    >

    </button>


    <button
      id="birthdayTakeoverTestSlam"
      class="birthday-test-button"
      type="button"
    >
      SLAM
    </button>


    <button
      id="birthdayTakeoverTestStory"
      class="birthday-test-button"
      type="button"
    >

    </button>


    <button
      id="birthdayTakeoverTestEngagement"
      class="birthday-test-button"
      type="button"
    >
      ENGAGEMENT
    </button>


    <button
      id="birthdayTakeoverTestFinal"
      class="birthday-test-button"
      type="button"
    >
      FINAL
    </button>

  </div>
