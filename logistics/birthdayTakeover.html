<!-- DAVIS BIRTHDAY TAKEOVER: temporary partial loaded by js/birthdayTakeover.js -->
<style id="birthdayTakeoverStyles">
  .birthday-hidden{display:none!important}
  body.birthday-takeover-active{overflow:hidden}
  body.birthday-cursor-hidden,body.birthday-cursor-hidden *{cursor:none!important}
  #birthdayTakeoverRoot{position:relative;z-index:9990;font-family:Arial,Helvetica,sans-serif}

  /* Intro */
  .birthday-modal{position:fixed;top:50%;left:50%;z-index:10001;width:min(440px,calc(100vw - 40px));padding:34px 32px;box-sizing:border-box;transform:translate(-50%,-50%);background:rgba(255,255,255,.985);border:1px solid rgba(48,59,67,.14);border-radius:18px;box-shadow:0 24px 70px rgba(38,45,40,.22);text-align:center}
  .birthday-modal-title{margin:0;color:#303b43;font-family:Georgia,"Times New Roman",serif;font-size:clamp(24px,3vw,30px);font-weight:700;line-height:1.3}
  .birthday-modal-actions{display:flex;justify-content:center;gap:12px;margin-top:26px}
  .birthday-button{min-width:88px;min-height:44px;padding:10px 20px;border:0;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:.07em;cursor:pointer}
  .birthday-button-primary{color:#fff;background:#879887}
  .birthday-button-secondary{color:#5b655f;background:#eee9e1}
  .birthday-button-disabled{color:#aaa6a0!important;background:#dedad3!important;text-decoration:line-through;pointer-events:none}
  #birthdayTakeoverClose{position:fixed;z-index:10002;transition:left 160ms cubic-bezier(.2,.9,.2,1),top 160ms cubic-bezier(.2,.9,.2,1),opacity 160ms ease}
  #birthdayTakeoverClose.birthday-reading{opacity:0;pointer-events:none}

  /* Terminal */
  .birthday-terminal{position:fixed;top:50%;left:50%;z-index:11001;width:min(560px,calc(100vw - 42px));overflow:hidden;transform:translate(-50%,-50%);color:#eaf1ed;background:#151d22;border:1px solid #35454e;border-radius:10px;box-shadow:0 24px 75px rgba(0,0,0,.48);font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.72}
  .birthday-terminal-bar{display:flex;align-items:center;gap:14px;min-height:34px;padding:7px 12px;color:#bdc6c1;background:#28343b;font-size:11px;letter-spacing:.05em}
  .birthday-terminal-dots{display:flex;gap:6px}.birthday-terminal-dots span{width:7px;height:7px;border-radius:50%;background:#818b87}
  .birthday-terminal-body{min-height:230px;padding:20px;box-sizing:border-box;white-space:pre-wrap}
  #birthdayTakeoverTerminalText{white-space:pre-wrap}
  .birthday-terminal-cursor,.birthday-story-text-cursor{display:inline-block;width:.62em;height:1.05em;margin-left:3px;vertical-align:-.17em;background:currentColor;animation:birthdayCursorBlink 760ms steps(1,end) infinite}
  @keyframes birthdayCursorBlink{0%,48%{opacity:1}49%,100%{opacity:0}}

  /* Progress + extraction */
  .birthday-progress-wrap{margin-top:18px}.birthday-progress-track{width:100%;height:8px;overflow:hidden;background:#0e1418;border:1px solid #53616a}.birthday-progress-bar{width:0;height:100%;background:#eaf1ed;transition:width 220ms linear}.birthday-progress-meta{display:flex;justify-content:space-between;margin-top:7px;color:#aebbb4;font-size:11px}
  .birthday-extract-character{display:inline-block;position:relative;white-space:pre}.birthday-character-removing{animation:birthdayCharacterExtraction 520ms steps(3,end) forwards}.birthday-character-gone{visibility:hidden}
  @keyframes birthdayCharacterExtraction{0%{opacity:1;transform:none;filter:none}20%{opacity:.08;transform:translateX(-3px);filter:blur(1px)}40%{opacity:1;transform:translateX(4px) skewX(-12deg)}63%{opacity:.08;transform:translateY(-3px) scaleY(1.5)}80%{opacity:1;filter:contrast(2)}100%{opacity:0;transform:scale(.1);filter:blur(3px)}}

  /* Glitch */
  .birthday-glitch-target{transform-origin:center}.birthday-glitch-target.birthday-glitching{animation:birthdayPageJitter 220ms steps(2,end) infinite}
  @keyframes birthdayPageJitter{0%{transform:translate(0,0);filter:none}20%{transform:translate(-3px,1px);filter:contrast(1.08)}40%{transform:translate(4px,-1px);filter:saturate(1.3)}60%{transform:translate(-2px,2px);filter:contrast(1.2)}80%{transform:translate(5px,0);filter:saturate(.8) contrast(1.25)}100%{transform:translate(0,0);filter:none}}
  .birthday-glitch-noise,.birthday-glitch-tear,.birthday-corruption,.birthday-crt,.birthday-launch,.birthday-black,.birthday-slam,.birthday-story,.birthday-final{position:fixed;inset:0}
  .birthday-glitch-noise{z-index:10995;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0,rgba(255,255,255,.07) 1px,rgba(0,0,0,.045) 2px,rgba(0,0,0,.045) 4px)}
  .birthday-glitch-noise.birthday-glitch-visible{opacity:.48;animation:birthdayNoisePulse 280ms steps(2,end) infinite}@keyframes birthdayNoisePulse{0%{opacity:.15}50%{opacity:.58}100%{opacity:.23}}
  .birthday-glitch-tear{z-index:10996;top:42%;bottom:auto;height:72px;opacity:0;pointer-events:none;background:rgba(255,255,255,.13);backdrop-filter:contrast(1.7) saturate(1.5)}.birthday-glitch-tear.birthday-glitch-visible{opacity:.72;animation:birthdayTearMove 250ms steps(2,end) infinite}@keyframes birthdayTearMove{0%{transform:translateX(18px)}50%{transform:translateX(-30px)}100%{transform:translateX(9px)}}
  .birthday-corruption{z-index:10999;pointer-events:none}.birthday-corruption-block{position:absolute;opacity:0;transform:scale(.2);background:#000;animation:birthdayBlockEat 450ms steps(3,end) forwards}@keyframes birthdayBlockEat{0%{opacity:0;transform:scale(.2)}35%{opacity:.95;transform:scale(1.08)}60%{opacity:.6;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}

  /* CRT / launch */
  .birthday-crt{z-index:12000;background:#000;pointer-events:none}.birthday-crt.birthday-crt-active{animation:birthdayCRTOff 900ms cubic-bezier(.2,.75,.2,1) forwards}@keyframes birthdayCRTOff{0%{clip-path:inset(0);background:rgba(255,255,255,0)}35%{clip-path:inset(42% 0);background:#fff}60%{clip-path:inset(49.2% 0);transform:scaleX(.72);background:#fff}80%{clip-path:inset(49.6% 49%);background:#fff}100%{clip-path:inset(50%);background:#000}}
  .birthday-launch{z-index:12001;display:flex;align-items:center;justify-content:center;color:#eaf1ed;background:#000;font-family:Consolas,"Courier New",monospace;font-size:clamp(14px,2vw,18px)}.birthday-black{z-index:12002;background:#000}

  /* Slams */
  .birthday-slam{z-index:12003;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#fff;background:#000;font-family:Consolas,"Courier New",monospace;font-size:clamp(58px,11vw,132px);font-weight:800;letter-spacing:-.07em;text-align:center}.birthday-slam-hit{animation:birthdayWordSlam 620ms cubic-bezier(.12,.9,.18,1) forwards}.birthday-slam-impact{animation:birthdayScreenImpact 180ms linear}
  @keyframes birthdayWordSlam{0%{opacity:0;transform:scale(2.6);filter:blur(14px)}45%{opacity:1;transform:scale(.87);filter:none}72%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}@keyframes birthdayScreenImpact{0%{transform:translate(0)}25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-2px)}75%{transform:translate(-2px,2px)}100%{transform:translate(0)}}
  .birthday-slam-flash{position:absolute;inset:0;z-index:-1;opacity:0;background:rgba(255,255,255,.82)}.birthday-flash-active{animation:birthdayImpactFlash 150ms ease-out}@keyframes birthdayImpactFlash{0%{opacity:.82}100%{opacity:0}}

  /* Story + firefly photo motion */
  .birthday-story{z-index:12004;overflow:hidden;color:#fff;background:#000;opacity:1;transition:opacity 1600ms ease}.birthday-story-fading{opacity:0}
  .birthday-photo-layer,.birthday-engagement-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}.birthday-photo-layer{z-index:4}.birthday-engagement-layer{z-index:6}
  .birthday-photo{position:absolute;overflow:hidden;opacity:0;border-radius:15px;background:#161616;box-shadow:0 12px 36px rgba(0,0,0,.34);will-change:transform,opacity;animation:birthdayPhotoDrift var(--drift-duration,13s) ease-in-out var(--drift-delay,0s) infinite alternate,birthdayPhotoGlow var(--fade-duration,8s) ease-in-out var(--fade-delay,0s) infinite}
  .birthday-photo img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
  @keyframes birthdayPhotoDrift{0%{transform:translate(var(--x1,-12px),var(--y1,8px)) rotate(var(--r1,-1deg)) scale(var(--s1,.98))}35%{transform:translate(var(--x2,14px),var(--y2,-15px)) rotate(var(--r2,.8deg)) scale(var(--s2,1.03))}70%{transform:translate(var(--x3,-6px),var(--y3,18px)) rotate(var(--r3,-.4deg)) scale(var(--s3,1.01))}100%{transform:translate(var(--x4,17px),var(--y4,-7px)) rotate(var(--r4,1.2deg)) scale(var(--s4,1.04))}}
  @keyframes birthdayPhotoGlow{0%,100%{opacity:.1}18%{opacity:.68}52%{opacity:.88}78%{opacity:.48}}
  .birthday-story-text{position:absolute;z-index:12;top:50%;left:50%;width:min(800px,82vw);transform:translate(-50%,-50%);color:rgba(255,255,255,.98);font-family:Consolas,"Courier New",monospace;font-size:clamp(19px,3vw,34px);line-height:1.55;text-align:center;text-shadow:0 3px 22px rgba(0,0,0,.95);transition:opacity 900ms ease;pointer-events:none}.birthday-text-fading{opacity:0}

  /* Engagement: 3 images */
  .birthday-engagement-photo{position:absolute;overflow:hidden;opacity:0;border-radius:15px;background:#151515;box-shadow:0 14px 40px rgba(0,0,0,.42);transition:opacity 1200ms ease}.birthday-engagement-photo img{width:100%;height:100%;object-fit:cover}.birthday-engagement-visible{opacity:.9}
  .birthday-engagement-focal{z-index:5;top:46%;left:50%;width:min(42vw,540px);height:min(57vh,620px);transform:translate(-50%,-50%);animation:birthdayEngagementFocal 10s ease-in-out infinite alternate,birthdayEngagementFade 7.5s ease-in-out infinite}@keyframes birthdayEngagementFocal{0%{transform:translate(-50%,-50%) translate(-7px,5px) rotate(-.5deg) scale(.985)}100%{transform:translate(-50%,-50%) translate(9px,-9px) rotate(.6deg) scale(1.025)}}
  .birthday-engagement-orbit{width:min(24vw,320px);height:min(31vh,350px);animation:birthdayEngagementOrbit var(--engagement-speed,11s) ease-in-out var(--engagement-delay,0s) infinite alternate,birthdayEngagementFade var(--engagement-fade,8s) ease-in-out var(--engagement-fade-delay,0s) infinite}@keyframes birthdayEngagementOrbit{0%{transform:translate(-12px,9px) rotate(-1.1deg) scale(.98)}50%{transform:translate(15px,-13px) rotate(1.2deg) scale(1.03)}100%{transform:translate(-4px,15px) rotate(-.5deg) scale(1.01)}}@keyframes birthdayEngagementFade{0%,100%{opacity:.42}35%,65%{opacity:.94}}
  .birthday-engagement-pos-1{top:7vh;left:5vw}.birthday-engagement-pos-2{right:5vw;bottom:7vh}

  /* Final */
  .birthday-final{z-index:12005;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;box-sizing:border-box;color:#fff;background:#000;text-align:center;opacity:1}.birthday-final-message{max-width:820px;opacity:0;white-space:pre-line;font-family:Consolas,"Courier New",monospace;font-size:clamp(20px,3.2vw,36px);line-height:1.55;transition:opacity 1200ms ease}.birthday-final-visible{opacity:1}.birthday-countdown{min-height:42px;margin-top:34px;color:rgba(255,255,255,.48);font-family:Consolas,"Courier New",monospace;font-size:clamp(18px,2.5vw,26px);font-weight:700;letter-spacing:.16em}.birthday-final-fading{opacity:0;transition:opacity 1600ms ease}

  /* Test controls */
  .birthday-test-controls{position:fixed;right:18px;bottom:18px;z-index:13000;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:520px;cursor:auto!important}.birthday-test-controls *{cursor:pointer!important}.birthday-test-button{min-height:38px;padding:8px 12px;color:#303b43;background:rgba(255,255,255,.94);border:1px solid rgba(48,59,67,.16);border-radius:8px;box-shadow:0 5px 18px rgba(0,0,0,.14);font-size:10px;font-weight:800;letter-spacing:.04em}

  @media(max-width:700px){.birthday-terminal{width:calc(100vw - 28px);font-size:12px}.birthday-terminal-body{min-height:205px;padding:17px}.birthday-photo{border-radius:10px}.birthday-engagement-focal{width:58vw;height:46vh}.birthday-engagement-orbit{width:31vw;height:23vh}.birthday-story-text{width:86vw;font-size:clamp(18px,5vw,27px)}}
</style>

<div id="birthdayTakeoverRoot" aria-hidden="true">
  <div id="birthdayTakeoverModal" class="birthday-modal birthday-hidden" role="dialog" aria-modal="true" aria-labelledby="birthdayTakeoverModalTitle">
    <h2 id="birthdayTakeoverModalTitle" class="birthday-modal-title">sorry.</h2>
    <div class="birthday-modal-actions">
      <button id="birthdayTakeoverSkip" class="birthday-button birthday-button-secondary birthday-hidden" type="button">SKIP</button>
      <button id="birthdayTakeoverOk" class="birthday-button birthday-button-primary birthday-hidden" type="button">OK</button>
    </div>
  </div>

  <button id="birthdayTakeoverClose" class="birthday-button birthday-button-primary birthday-hidden" type="button">CLOSE</button>

  <div id="birthdayTakeoverTerminal" class="birthday-terminal birthday-hidden" aria-live="polite">
    <div class="birthday-terminal-bar">
      <div class="birthday-terminal-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <span>SYSTEM OVERRIDE</span>
    </div>
    <div class="birthday-terminal-body">
      <span id="birthdayTakeoverTerminalText"></span><span id="birthdayTakeoverTerminalCursor" class="birthday-terminal-cursor" aria-hidden="true"></span>
      <div id="birthdayTakeoverProgressWrap" class="birthday-progress-wrap birthday-hidden">
        <div class="birthday-progress-track" aria-hidden="true"><div id="birthdayTakeoverProgress" class="birthday-progress-bar"></div></div>
        <div class="birthday-progress-meta"><span>extracting</span><span id="birthdayTakeoverProgressPercent">0%</span></div>
      </div>
    </div>
  </div>

  <div id="birthdayTakeoverNoise" class="birthday-glitch-noise" aria-hidden="true"></div>
  <div id="birthdayTakeoverTear" class="birthday-glitch-tear" aria-hidden="true"></div>
  <div id="birthdayTakeoverCorruption" class="birthday-corruption" aria-hidden="true"></div>
  <div id="birthdayTakeoverCRT" class="birthday-crt birthday-hidden" aria-hidden="true"></div>

  <div id="birthdayTakeoverLaunch" class="birthday-launch birthday-hidden"><span>takeover.exe launching</span><span class="birthday-terminal-cursor" aria-hidden="true"></span></div>
  <div id="birthdayTakeoverBlack" class="birthday-black birthday-hidden" aria-hidden="true"></div>

  <div id="birthdayTakeoverSlam" class="birthday-slam birthday-hidden" aria-live="polite"><div id="birthdayTakeoverSlamFlash" class="birthday-slam-flash" aria-hidden="true"></div><span id="birthdayTakeoverSlamText"></span></div>

  <div id="birthdayTakeoverStory" class="birthday-story birthday-hidden">
    <div id="birthdayTakeoverPhotoLayer" class="birthday-photo-layer" aria-hidden="true"></div>
    <div id="birthdayTakeoverEngagementLayer" class="birthday-engagement-layer" aria-hidden="true"></div>
    <div id="birthdayTakeoverStoryText" class="birthday-story-text"><span id="birthdayTakeoverStoryTextValue"></span><span id="birthdayTakeoverStoryCursor" class="birthday-story-text-cursor birthday-hidden" aria-hidden="true"></span></div>
  </div>

  <div id="birthdayTakeoverFinal" class="birthday-final birthday-hidden"><div id="birthdayTakeoverFinalMessage" class="birthday-final-message">Happy 33rd Birthday,\nHere's to many more together</div><div id="birthdayTakeoverCountdown" class="birthday-countdown" aria-live="polite"></div></div>

  <audio id="birthdayTakeoverLoveAudio" preload="auto" src="Assets/takeover/cantHelpFallingInLove.mp3"></audio>
  <audio id="birthdayTakeoverBirthdayAudio" preload="auto" src="Assets/takeover/happyBirthday.mp3"></audio>
  <audio id="birthdayTakeoverGlitchAudio" preload="auto" src="Assets/takeover/glitch.mp3"></audio>
  <audio id="birthdayTakeoverCrtAudio" preload="auto" src="Assets/takeover/crtOff.mp3"></audio>
  <audio id="birthdayTakeoverSlamAudio" preload="auto" src="Assets/takeover/slam.mp3"></audio>

  <div id="birthdayTakeoverTestControls" class="birthday-test-controls birthday-hidden">
    <button id="birthdayTakeoverTestRestart" class="birthday-test-button" type="button">RESTART</button>
    <button id="birthdayTakeoverTestTerminal" class="birthday-test-button" type="button">TERMINAL</button>
    <button id="birthdayTakeoverTestGlitch" class="birthday-test-button" type="button">GLITCH</button>
    <button id="birthdayTakeoverTestSlam" class="birthday-test-button" type="button">SLAM</button>
    <button id="birthdayTakeoverTestStory" class="birthday-test-button" type="button">MONTAGE</button>
    <button id="birthdayTakeoverTestEngagement" class="birthday-test-button" type="button">ENGAGEMENT</button>
    <button id="birthdayTakeoverTestFinal" class="birthday-test-button" type="button">FINAL</button>
  </div>
</div>
