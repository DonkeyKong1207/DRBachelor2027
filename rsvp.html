<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RSVP | BachelorX 2027</title>

    <!-- Your site-wide styles -->
    <link rel="stylesheet" href="css/global.css">

    <!-- RSVP-specific styles -->
    <link rel="stylesheet" href="css/rsvp.css">
</head>


<body>

    <!-- =========================================================
         RSVP PAGE
    ========================================================== -->

    <!-- PASTE YOUR EXISTING:
         <section class="rsvp-page">
         ...
         </section>
         HERE
    -->


    <!-- =========================================================
         ICON LIBRARY
    ========================================================== -->

    <script src="https://unpkg.com/lucide@latest"></script>


    <!-- =========================================================
         RSVP CONTROLLER
    ========================================================== -->

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            /* =====================================================
               ELEMENTS
            ====================================================== */

            const form = document.getElementById("tripRsvpForm");

            const steps = Array.from(
                document.querySelectorAll(".rsvp-step")
            );

            const backButton =
                document.getElementById("rsvpBackButton");

            const nextButton =
                document.getElementById("rsvpNextButton");

            const submitButton =
                document.getElementById("rsvpSubmitButton");

            const progressLabel =
                document.getElementById("rsvpProgressLabel");

            const progressCount =
                document.getElementById("rsvpProgressCount");

            const progressFill =
                document.getElementById("rsvpProgressFill");

            const formMessage =
                document.getElementById("rsvpFormMessage");


            /* =====================================================
               STATE
            ====================================================== */

            let currentStep = 0;


            /* =====================================================
               ICONS
            ====================================================== */

            if (window.lucide) {
                lucide.createIcons();
            }


            /* =====================================================
               STEP NAVIGATION
            ====================================================== */

            function showStep(index) {

                currentStep = index;

                steps.forEach((step, stepIndex) => {

                    step.classList.toggle(
                        "active",
                        stepIndex === currentStep
                    );

                });


                const activeStep = steps[currentStep];

                const label =
                    activeStep.dataset.rsvpLabel || "";

                progressLabel.textContent = label;

                progressCount.textContent =
                    `Step ${currentStep + 1} of ${steps.length}`;

                progressFill.style.width =
                    `${((currentStep + 1) / steps.length) * 100}%`;


                /* Back button */

                backButton.disabled =
                    currentStep === 0;


                /* Continue / Submit */

                const finalStep =
                    currentStep === steps.length - 1;

                nextButton.hidden = finalStep;
                submitButton.hidden = !finalStep;


                formMessage.textContent = "";


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }


            /* =====================================================
               VALIDATION
            ====================================================== */

            function clearErrors(step) {

                step
                    .querySelectorAll(".rsvp-field-error")
                    .forEach(element => {
                        element.classList.remove(
                            "rsvp-field-error"
                        );
                    });

            }


            function validateCurrentStep() {

                const step = steps[currentStep];

                clearErrors(step);

                const requiredFields =
                    Array.from(
                        step.querySelectorAll("[required]")
                    );


                for (const field of requiredFields) {

                    /*
                     * RADIO GROUPS
                     */

                    if (field.type === "radio") {

                        const group = step.querySelectorAll(
                            `input[name="${field.name}"]`
                        );

                        const checked =
                            Array.from(group)
                                .some(input => input.checked);

                        if (!checked) {

                            const container =
                                field.closest(
                                    ".rsvp-choice-group"
                                );

                            if (container) {
                                container.classList.add(
                                    "rsvp-field-error"
                                );
                            }

                            formMessage.textContent =
                                "Please answer the required question before continuing.";

                            return false;
                        }

                        continue;
                    }


                    /*
                     * NORMAL INPUTS
                     */

                    if (!field.checkValidity()) {

                        const container =
                            field.closest(".rsvp-field");

                        if (container) {
                            container.classList.add(
                                "rsvp-field-error"
                            );
                        }

                        formMessage.textContent =
                            "Please complete the required fields before continuing.";

                        field.focus();

                        return false;
                    }

                }


                return true;
            }


            nextButton.addEventListener(
                "click",
                () => {

                    if (!validateCurrentStep()) {
                        return;
                    }

                    if (currentStep < steps.length - 1) {
                        showStep(currentStep + 1);
                    }

                }
            );


            backButton.addEventListener(
                "click",
                () => {

                    if (currentStep > 0) {
                        showStep(currentStep - 1);
                    }

                }
            );


            /* =====================================================
               ATTENDING / DECLINE
            ====================================================== */

            const attendingInputs =
                document.querySelectorAll(
                    'input[name="attending"]'
                );

            const declinePanel =
                document.getElementById(
                    "declineReasonPanel"
                );


            attendingInputs.forEach(input => {

                input.addEventListener("change", () => {

                    const attending =
                        document.querySelector(
                            'input[name="attending"]:checked'
                        )?.value;

                    declinePanel.hidden =
                        attending !== "no";

                });

            });


            /* =====================================================
               FLIGHT ACCOMMODATION
            ====================================================== */

            const flightAccommodationInputs =
                document.querySelectorAll(
                    'input[name="flightAccommodation"]'
                );

            const flightAccommodationPanel =
                document.getElementById(
                    "flightAccommodationPanel"
                );


            flightAccommodationInputs.forEach(input => {

                input.addEventListener("change", () => {

                    const value =
                        document.querySelector(
                            'input[name="flightAccommodation"]:checked'
                        )?.value;

                    flightAccommodationPanel.hidden =
                        value === "no";

                });

            });


            /* =====================================================
               ACTIVITY CONCERN
            ====================================================== */

            const activityInputs =
                document.querySelectorAll(
                    'input[name="activityConcern"]'
                );

            const activityPanel =
                document.getElementById(
                    "activityConcernPanel"
                );


            activityInputs.forEach(input => {

                input.addEventListener("change", () => {

                    const value =
                        document.querySelector(
                            'input[name="activityConcern"]:checked'
                        )?.value;

                    activityPanel.hidden =
                        value !== "yes" &&
                        value !== "maybe";

                });

            });


            /* =====================================================
               GUEST REQUEST
            ====================================================== */

            const guestRequestInputs =
                document.querySelectorAll(
                    'input[name="guestRequest"]'
                );

            const guestRequestPanel =
                document.getElementById(
                    "guestRequestPanel"
                );


            guestRequestInputs.forEach(input => {

                input.addEventListener("change", () => {

                    const value =
                        document.querySelector(
                            'input[name="guestRequest"]:checked'
                        )?.value;

                    guestRequestPanel.hidden =
                        value !== "yes";

                });

            });


            /* =====================================================
               MANIFEST PHOTO
            ====================================================== */

            const manifestPhoto =
                document.getElementById(
                    "manifestPhoto"
                );

            const manifestPhotoName =
                document.getElementById(
                    "manifestPhotoName"
                );


            manifestPhoto.addEventListener(
                "change",
                () => {

                    const file =
                        manifestPhoto.files?.[0];

                    if (!file) {

                        manifestPhotoName.textContent =
                            "No file selected";

                        return;
                    }


                    manifestPhotoName.textContent =
                        file.name;

                }
            );


            /* =====================================================
               FLIGHT PRICES
            ====================================================== */

            const FLIGHT_PRICES = {

                AUS: 799.57,

                PHX: 843.57,

                SFO: 1088.57

            };


            const DEPOSIT = 100;


            const airportLabel =
                document.getElementById(
                    "rsvpPaymentAirportLabel"
                );

            const airportPrice =
                document.getElementById(
                    "rsvpPaymentAirportPrice"
                );


            const departureAirportInputs =
                document.querySelectorAll(
                    'input[name="departureAirport"]'
                );


            function formatMoney(amount) {

                return amount.toLocaleString(
                    "en-US",
                    {
                        style: "currency",
                        currency: "USD"
                    }
                );

            }


            function updatePaymentEstimates() {

                const airport =
                    document.querySelector(
                        'input[name="departureAirport"]:checked'
                    )?.value;


                const estimates =
                    document.querySelectorAll(
                        "[data-plan-estimate]"
                    );


                if (!FLIGHT_PRICES[airport]) {

                    airportLabel.textContent =
                        airport === "other"
                            ? "Custom travel plan"
                            : "Select an airport first";

                    airportPrice.textContent =
                        "We’ll calculate the reminder amounts from your round-trip airfare after the $100 deposit.";


                    estimates.forEach(element => {

                        element.textContent =
                            "Select an airport to calculate";

                    });

                    return;
                }


                const total =
                    FLIGHT_PRICES[airport];

                const remaining =
                    total - DEPOSIT;


                airportLabel.textContent =
                    `${airport} Group Flight — ${formatMoney(total)}`;

                airportPrice.textContent =
                    `${formatMoney(DEPOSIT)} deposit, followed by ${formatMoney(remaining)} remaining.`;


                const planAmounts = {

                    "no-reminders":
                        `${formatMoney(remaining)} remaining • no routine reminders`,

                    "monthly":
                        `About ${formatMoney(remaining / 6)} per reminder`,

                    "twice-monthly":
                        `About ${formatMoney(remaining / 12)} per reminder`,

                    "quarters":
                        `About ${formatMoney(remaining / 4)} per reminder`

                };


                estimates.forEach(element => {

                    const plan =
                        element.dataset.planEstimate;

                    element.textContent =
                        planAmounts[plan] || "";

                });

            }


            departureAirportInputs.forEach(input => {

                input.addEventListener(
                    "change",
                    updatePaymentEstimates
                );

            });


            /* =====================================================
               SUBMIT
            ====================================================== */

            form.addEventListener(
                "submit",
                async event => {

                    event.preventDefault();

                    if (!validateCurrentStep()) {
                        return;
                    }


                    submitButton.disabled = true;

                    submitButton.innerHTML =
                        `Submitting…`;


                    formMessage.textContent =
                        "Connecting your RSVP…";


                    /*
                     * GOOGLE SHEETS SUBMISSION WILL GO HERE.
                     *
                     * For now we are deliberately stopping here.
                     * Once your Apps Script Web App is deployed,
                     * we will replace this section with the actual
                     * POST request.
                     */


                    setTimeout(() => {

                        submitButton.disabled = false;

                        submitButton.innerHTML =
                            `Submit RSVP <i data-lucide="send"></i>`;

                        if (window.lucide) {
                            lucide.createIcons();
                        }

                        formMessage.textContent =
                            "The form is ready — Google Sheets connection is the next step.";

                    }, 500);

                }
            );


            /* =====================================================
               INITIALIZE
            ====================================================== */

            showStep(0);
            updatePaymentEstimates();

        });
    </script>

</body>

</html>
